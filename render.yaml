services:
  - type: web
    name: kitchen-qr-app
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_PAYMENTS
        value: "true"
      # PUBLIC_BASE_URL auto-falls back to RENDER_EXTERNAL_URL in the Dockerfile.
      # Set it explicitly here only if you use a custom domain.
